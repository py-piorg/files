<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Staff Portal | Triple A Gas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/offical_logo.png" type="image/png">
<meta name="theme-color" content="#14080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0a0c; --bg2:#170f12; --panel:#1d1417; --panel2:#251a1e; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f6eef0; --muted:#b29ba1; --faint:#7d666c;
  --brand:#c8324a; --brand2:#e04a62; --gold:#e3b04b; --safe:#3ccf8e; --warn:#f0b43c; --danger:#ff5d6c; --blue:#5aa7ff;
  --mono:'JetBrains Mono',ui-monospace,monospace; --r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:var(--gold);}
.hidden{display:none!important;}

/* ── auth ── */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:radial-gradient(circle at 80% 10%,rgba(200,50,74,.18),transparent 55%),var(--bg);}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:28px 24px;box-shadow:0 30px 70px rgba(0,0,0,.5);}
.auth-logo{text-align:center;margin-bottom:20px;}
.auth-logo img{height:46px;}
.auth-logo b{display:block;font-size:16px;font-weight:800;letter-spacing:.04em;margin-top:8px;}
.auth-logo span{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;}
.auth h2{font-size:17px;margin-bottom:4px;}
.auth p.sub{color:var(--muted);font-size:13px;margin-bottom:16px;}

/* ── forms ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:15px;min-height:44px;}
textarea{min-height:80px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(224,74,98,.2);}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;text-decoration:none;white-space:nowrap;}
.btn:hover{border-color:rgba(255,255,255,.28);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand2);}
.btn-safe{background:#1f7a4f;border-color:#1f7a4f;color:#fff;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2a1a05;}
.btn-danger{background:transparent;border-color:rgba(255,93,108,.5);color:var(--danger);}
.btn-sm{min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn-xl{min-height:60px;font-size:18px;border-radius:14px;}
.err{color:var(--danger);font-size:13px;min-height:1em;margin-top:8px;}
.note{background:rgba(227,176,75,.1);border:1px solid rgba(227,176,75,.3);border-radius:12px;padding:12px 14px;font-size:13px;color:#f3d79a;line-height:1.5;}
.note.danger{background:rgba(255,93,108,.08);border-color:rgba(255,93,108,.35);color:#ffc2c8;}
.note code{font-family:var(--mono);background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;}

/* ── shell ── */
.shell{display:flex;min-height:100vh;}
.side{width:236px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.side-head{padding:16px 16px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);}
.side-head img{height:30px;}
.side-head b{font-size:13px;font-weight:800;letter-spacing:.04em;display:block;}
.side-head span{font-size:10px;color:var(--gold);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;}
.me{padding:12px 16px;border-bottom:1px solid var(--line);}
.me b{display:block;font-size:14px;}
.me small{color:var(--muted);font-size:12px;}
.nav{flex:1;overflow-y:auto;padding:8px;}
.nav-group{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;font-weight:700;padding:12px 10px 4px;}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;}
.nav button:hover{background:var(--panel);color:var(--text);}
.nav button.active{background:rgba(200,50,74,.18);color:#fff;}
.nav .ico{width:20px;text-align:center;}
.nav .count{margin-left:auto;background:var(--brand);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px;}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(15,10,12,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;}
.top h1{font-size:18px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top select{width:auto;min-height:38px;padding:6px 10px;font-size:13px;}
.menu-btn{display:none;}
.conn{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.conn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--safe);}
.conn.off::before{background:var(--danger);}
.view{padding:20px;max-width:1280px;width:100%;}
.overlay{display:none;}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;}
  .side.open{transform:none;}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;}
  .menu-btn{display:inline-flex;}
  .view{padding:14px 14px 90px;}
  .top{padding:10px 14px;}
  .conn span{display:none;}
}

/* ── components ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.panel h3{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;}
.panel h3 small{font-weight:500;color:var(--muted);font-size:12px;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cols-3{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
@media(max-width:1000px){.cols{grid-template-columns:1fr;}}
@media(max-width:1250px){.cols-3{grid-template-columns:1fr;}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px;}
.kpi.gold .v{color:var(--gold);} .kpi.safe .v{color:var(--safe);} .kpi.warn .v{color:var(--warn);} .kpi.danger .v{color:var(--danger);}
.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--faint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr.click{cursor:pointer;} tr.click:hover td{background:rgba(255,255,255,.03);}
.mono{font-family:var(--mono);}
.num{text-align:right;font-family:var(--mono);white-space:nowrap;}
.empty{color:var(--faint);text-align:center;padding:22px 10px;font-size:13px;}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.badge.warn{background:rgba(240,180,60,.15);color:var(--warn);}
.badge.gold{background:rgba(227,176,75,.18);color:var(--gold);}
.badge.safe{background:rgba(60,207,142,.15);color:var(--safe);}
.badge.danger{background:rgba(255,93,108,.15);color:var(--danger);}
.badge.neutral{background:rgba(255,255,255,.08);color:var(--muted);}
.badge.blue{background:rgba(90,167,255,.15);color:var(--blue);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.toolbar input,.toolbar select{width:auto;min-height:38px;font-size:13px;padding:7px 10px;}
.toolbar .grow{flex:1;min-width:160px;}
.bar{height:10px;background:var(--bg2);border-radius:10px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--safe);border-radius:10px;}
.bar.warn>i{background:var(--warn);} .bar.danger>i{background:var(--danger);}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px;}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end;}
.chart .c i{display:block;width:100%;max-width:38px;background:linear-gradient(var(--brand2),var(--brand));border-radius:5px 5px 2px 2px;min-height:2px;}
.chart .c span{font-size:10px;color:var(--faint);white-space:nowrap;}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-row .grow{flex:1;min-width:0;}
.list-row .grow small{display:block;color:var(--muted);font-size:12px;}
.code-chip{font-family:var(--mono);font-weight:700;font-size:16px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;letter-spacing:.08em;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tabs button{border:1px solid var(--line2);background:transparent;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1.5px solid var(--line2);background:var(--bg2);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;min-height:44px;font-size:13.5px;}
.chip small{display:block;font-weight:500;font-size:11px;color:var(--muted);}
.chip.on{border-color:var(--brand2);background:rgba(200,50,74,.18);}

/* ── cashier / pump ── */
.codebox{display:flex;gap:10px;justify-content:center;margin:6px 0 14px;}
.codebox input{width:100%;max-width:320px;text-align:center;font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.35em;padding:10px 0 10px .35em;min-height:80px;border-radius:16px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;}
.keypad button{min-height:56px;font-size:22px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);}
.keypad button:active{background:var(--brand);}
.order-card{border:2px solid var(--line2);border-radius:18px;padding:18px;background:var(--bg2);}
.order-card.ok{border-color:rgba(60,207,142,.6);}
.order-card.bad{border-color:rgba(255,93,108,.6);}
.order-card.wait{border-color:rgba(240,180,60,.6);}
.big-what{font-size:30px;font-weight:800;line-height:1.15;margin:10px 0 4px;}
.big-amt{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--gold);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:12px;}
.kv dt{color:var(--muted);} .kv dd{font-weight:600;text-align:right;}
.verdict{font-size:22px;font-weight:800;padding:14px;border-radius:12px;text-align:center;margin-bottom:12px;}
.verdict.ok{background:rgba(60,207,142,.15);color:var(--safe);}
.verdict.bad{background:rgba(255,93,108,.15);color:var(--danger);}
.verdict.wait{background:rgba(240,180,60,.15);color:var(--warn);}
.qrbox{background:#fff;border-radius:14px;padding:10px;max-width:230px;margin:12px auto;}
.qrbox svg{display:block;width:100%;height:auto;}
.paymethods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.paymethods button{min-height:52px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel2);font-weight:800;cursor:pointer;}
.paymethods button.on{border-color:var(--gold);background:rgba(227,176,75,.15);color:var(--gold);}
.scan-video{width:100%;border-radius:14px;background:#000;aspect-ratio:1;object-fit:cover;}
.scan-frame{position:relative;}
.scan-frame::after{content:'';position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;}

/* ── modal & toast ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;}
.modal-card{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px;width:100%;max-width:520px;margin:auto;position:relative;}
.modal-card.wide{max-width:760px;}
.modal-card h2{font-size:17px;margin-bottom:14px;padding-right:40px;}
.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:18px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--safe);border-radius:12px;padding:12px 16px;z-index:200;transition:transform .25s ease;max-width:calc(100% - 32px);font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.warn{border-left-color:var(--warn);} .toast.danger{border-left-color:var(--danger);}

/* ── print slip (58/80mm thermal or A4) ── */
#printArea{display:none;}
@media print{
  body>*:not(#printArea){display:none!important;}
  #printArea{display:block!important;color:#000;background:#fff;font-family:Arial,sans-serif;width:72mm;margin:0 auto;font-size:12px;}
  #printArea h4{text-align:center;font-size:15px;margin:4px 0;}
  #printArea .pc{font-family:monospace;font-size:34px;text-align:center;font-weight:700;letter-spacing:6px;margin:6px 0;}
  #printArea .pq{width:46mm;margin:6px auto;}
  #printArea .pq svg{width:100%;height:auto;}
  #printArea .pr{display:flex;justify-content:space-between;border-bottom:1px dashed #999;padding:3px 0;}
  #printArea p{text-align:center;margin:6px 0;}
  @page{margin:4mm;}
}
</style>
</head>
<body>

<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="auth-logo"><img src="images/offical_logo.png" alt="Triple A Gas"><b>TRIPLE A GAS</b><span>Staff Portal</span></div>
    <div id="authBody"><p class="sub" style="text-align:center;">Connecting…</p></div>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="side" id="side">
    <div class="side-head"><img src="images/offical_logo.png" alt=""><div><b>TRIPLE A GAS</b><span>Staff Portal</span></div></div>
    <div class="me"><b id="meName"></b><small id="meRole"></small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn btn-sm" style="flex:1" data-view="account">👤 Account</button>
      <button class="btn btn-sm btn-danger" id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="top">
      <button class="btn btn-sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="viewTitle"></h1>
      <select id="outletSelect" class="hidden" aria-label="Station"></select>
      <div class="conn" id="conn"><span>Live</span></div>
    </header>
    <section class="view" id="view"></section>
  </div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="js/tag-common.js"></script>
<script src="js/admin-app.js"></script>
<script src="js/admin-ops.js"></script>
<script src="js/admin-manage.js"></script>
</body>
</html>
