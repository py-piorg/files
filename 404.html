    <style>
      .error-page {
        min-height: calc(100vh - var(--header-h) - 300px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 20px;
      }

      .error-card {
        max-width: 520px;
      }

      .error-code {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(80px, 15vw, 140px);
        line-height: 1;
        color: var(--flame);
        margin: 0 0 8px;
        letter-spacing: -0.03em;
      }

      .error-code-sub {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--steel-400);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 20px;
      }

      .error-card h1 {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(22px, 3.5vw, 28px);
        margin: 0 0 12px;
        color: var(--ink);
      }

      .error-card p {
        font-size: 16px;
        color: var(--steel-600);
        margin: 0 0 32px;
        line-height: 1.6;
      }

      .error-card .btn-row {
        justify-content: center;
      }

      .error-cylinder {
        width: 48px;
        height: 64px;
        background: var(--cylinder-blue);
        border-radius: 8px 8px 4px 4px;
        position: relative;
        margin: 0 auto 24px;
        animation: bounce-cylinder 2s ease infinite;
      }

      .error-cylinder::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 18px;
        height: 12px;
        background: var(--steel-600);
        border-radius: 3px 3px 0 0;
      }

      .error-cylinder::after {
        content: "";
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 16px;
        height: 16px;
        background: var(--hazard);
        border-radius: 50%;
        opacity: 0.7;
      }
    </style>
  </head>
