<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Order LPG online from Triple A Gas: get a 4-digit code, pay at the cashier, show your QR code at the pump." />
    <meta name="robots" content="noindex" />
    <title>My Order — Triple A Gas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/public.css" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="images/site.webmanifest" />
    <meta name="theme-color" content="#5D1020" />
    <style>
      /* Order tracker — uses the site tokens so it follows light/dark mode. */
      .ot { max-width: 520px; margin: 0 auto; }
      .ot-card { background: var(--paper); border: 1px solid var(--steel-100); border-radius: 20px; padding: 24px 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(93,16,32,.08); margin-bottom: 16px; animation: otRise .35s cubic-bezier(.2,.8,.2,1); }
      .ot-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
      .ot-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .ot-pill.warn { background: var(--hazard-pale); color: #9a6a0c; }
      .ot-pill.gold { background: var(--hazard-pale); color: #9a6a0c; }
      .ot-pill.safe { background: var(--safe-pale); color: var(--safe); }
      .ot-pill.neutral { background: var(--steel-100); color: var(--steel-600); }
      .ot-pill.danger { background: var(--danger-pale); color: var(--danger); }
      [data-theme="dark"] .ot-pill.warn, [data-theme="dark"] .ot-pill.gold { color: var(--hazard); }
      .ot-live { font-size: 12px; color: var(--steel-600); display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; }
      .ot-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: otPulse 1.6s infinite; }
      .ot h2 { font-family: var(--display); font-size: 22px; letter-spacing: -.01em; margin: 14px 0 6px; line-height: 1.25; color: var(--ink); }
      .ot-lead { color: var(--steel-600); font-size: 15px; line-height: 1.55; margin: 0; }
      .ot-lead b { color: var(--ink); }
      .ot-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 20px 0 4px; }
      .ot-track div { font-size: 11.5px; font-weight: 600; color: var(--steel-400); display: flex; flex-direction: column; gap: 7px; }
      .ot-track div::before { content: ""; height: 4px; border-radius: 4px; background: var(--steel-100); }
      .ot-track div.done { color: var(--safe); } .ot-track div.done::before { background: var(--safe); }
      .ot-track div.now { color: var(--flame); } .ot-track div.now::before { background: linear-gradient(90deg, var(--flame) 50%, var(--steel-100) 50%); background-size: 200% 100%; animation: otFill 1.6s ease-in-out infinite; }
      .ot-digits { display: flex; justify-content: center; gap: 10px; margin: 22px 0 8px; }
      .ot-digits span { width: 64px; height: 78px; border-radius: 16px; background: var(--flame-pale); color: var(--flame); display: grid; place-items: center; font-family: var(--mono); font-size: 40px; font-weight: 700; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--flame) 22%, transparent); }
      .ot-digits.small span { width: 44px; height: 54px; font-size: 26px; border-radius: 12px; }
      .ot-cap { text-align: center; font-size: 12px; font-weight: 600; color: var(--steel-600); text-transform: uppercase; letter-spacing: .08em; }
      .ot-qr { background: #fff; border-radius: 20px; padding: 14px; margin: 20px auto 8px; max-width: 300px; box-shadow: 0 0 0 1px var(--steel-100), 0 12px 30px rgba(0,0,0,.08); }
      .ot-qr svg { display: block; width: 100%; height: auto; }
      .ot-momo { display: flex; gap: 12px; align-items: flex-start; background: var(--hazard-pale); border-radius: 16px; padding: 14px; font-size: 14px; margin-top: 18px; line-height: 1.5; color: var(--ink); }
      .ot-momo .num { font-family: var(--mono); font-weight: 700; font-size: 16px; }
      .ot-rows { margin: 0; }
      .ot-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--steel-100); font-size: 14.5px; }
      .ot-rows div:last-child { border-bottom: none; }
      .ot-rows dt { color: var(--steel-600); } .ot-rows dd { font-weight: 600; text-align: right; margin: 0; color: var(--ink); }
      .ot-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding-top: 14px; border-top: 1px dashed var(--steel-300); }
      .ot-total span { color: var(--steel-600); font-size: 14px; }
      .ot-total b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
      .ot .btn { width: 100%; justify-content: center; margin-top: 10px; min-height: 50px; }
      .ot-muted { color: var(--steel-600); font-size: 13px; text-align: center; margin-top: 12px; line-height: 1.5; }
      .ot-ok { width: 64px; height: 64px; border-radius: 50%; background: var(--safe-pale); color: var(--safe); display: grid; place-items: center; margin: 4px auto 0; animation: otPop .45s cubic-bezier(.2,1.4,.4,1); }
      .ot-center { text-align: center; }
      .ot-list a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--steel-100); color: var(--ink); text-decoration: none; }
      .ot-list a:last-child { border-bottom: none; }
      .ot-list small { display: block; color: var(--steel-600); font-size: 12.5px; margin-top: 2px; }
      .ot-list .code { font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .1em; background: var(--flame-pale); color: var(--flame); padding: 4px 10px; border-radius: 10px; }
      .ot-steps { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 14px; }
      .ot-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
      .ot-steps b.n { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--flame); color: #fff; display: grid; place-items: center; font-size: 13px; }
      .ot-skel { background: linear-gradient(90deg, var(--steel-100), var(--paper), var(--steel-100)); background-size: 200% 100%; animation: otShimmer 1.2s infinite; border-radius: 12px; }
      @keyframes otRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes otPulse { 50% { opacity: .35; } }
      @keyframes otFill { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
      @keyframes otPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes otShimmer { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .ot * { animation: none !important; } }
      @media (max-width: 420px) { .ot-digits { gap: 8px; } .ot-digits span { width: 56px; height: 70px; font-size: 34px; } .ot-card { padding: 22px 18px; } }
      @media print { #site-header, #site-footer, .page-hero, .btn, .no-print, .floating-call, .back-to-top { display: none !important; } .ot-card { box-shadow: none; } }
    </style>
  </head>
  <body>
    <div id="site-header"></div>
    <section class="page-hero">
      <div class="container">
        <h1 id="otTitle">My order</h1>
        <p>Order online, pay at the cashier, then show your QR code at the pump.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <main class="ot" id="app"><div class="ot-card"><div class="ot-skel" style="height:22px;width:40%;"></div><div class="ot-skel" style="height:30px;width:70%;margin:16px 0;"></div><div class="ot-skel" style="height:78px;"></div></div></main>
      </div>
    </section>
    <div id="site-footer"></div>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/site-config.js"></script>
    <!-- Online ordering & live data (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="js/tag-common.js"></script>
    <script src="js/order-form.js"></script>
    <script src="js/company-info.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script>
      (function () {
        const T = window.TAG;
        const app = document.getElementById("app");
        const id = new URLSearchParams(location.search).get("id");
        let station = null;
        const svg = (p, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
        const fmtTime = (ts) => { const d = T.toDate(ts); return d ? d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—"; };
        const digits = (code, small) => `<div class="ot-digits ${small ? "small" : ""}" aria-label="Code ${T.esc(code)}">${String(code).split("").map((c) => `<span>${T.esc(c)}</span>`).join("")}</div>`;
        const track = (step) => `<div class="ot-track" aria-hidden="true">${["Ordered", "Paid", "Filled"].map((l, i) => `<div class="${i < step ? "done" : i === step ? "now" : ""}">${l}</div>`).join("")}</div>`;

        function details(o, extra = "") {
          return `<dl class="ot-rows">
            <div><dt>Order</dt><dd>${T.esc(T.describe(o))}</dd></div>
            <div><dt>Station</dt><dd>${T.esc(T.outletName(o.outlet))}</dd></div>
            ${o.type !== "exchange" ? `<div><dt>Price</dt><dd>${T.money(o.unitPrice)}/kg</dd></div>` : ""}
            ${o.customerName ? `<div><dt>Name</dt><dd>${T.esc(o.customerName)}</dd></div>` : ""}
            <div><dt>Placed</dt><dd>${fmtTime(o.createdAt)}</dd></div>
            ${extra}
          </dl>
          <div class="ot-total"><span>Total</span><b>${T.money(o.amount)}</b></div>`;
        }

        function render(o) {
          const st = T.effectiveStatus(o);
          const info = T.STATUS[st] || T.STATUS.pending;
          let html = "";
          if (st === "pending") {
            const momo = o.payPref === "momo" && station && station.momoNumber
              ? `<div class="ot-momo">${svg('<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>')}<div>Paying with <b>Mobile Money</b>? Send <b>${T.money(o.amount)}</b> to<br><span class="num">${T.esc(station.momoNumber)}</span>${station.momoName ? ` · ${T.esc(station.momoName)}` : ""}<br>Use <b>${T.esc(o.code)}</b> as the reference and show the cashier your SMS.</div></div>` : "";
            html = `<div class="ot-card">
                <span class="ot-pill ${info.tone}">${info.label}</span><span class="ot-live">Updates live</span>
                ${track(1)}
                <h2>Show this code at the cashier</h2>
                <p class="ot-lead">Go to <b>${T.esc(T.outletName(o.outlet))}</b> station and pay <b>${T.money(o.amount)}</b>. Your QR code appears here as soon as you've paid.</p>
                ${digits(o.code)}
                <div class="ot-cap">Your order code</div>
                ${momo}
              </div>
              <div class="ot-card">${details(o)}</div>
              <button class="btn btn-secondary no-print" id="cancelBtn">Cancel this order</button>
              <p class="ot-muted">Unpaid orders expire after 12 hours.</p>`;
          } else if (st === "paid") {
            html = `<div class="ot-card ot-center">
                <span class="ot-pill ${info.tone}">Paid · ready to fill</span>
                ${track(2)}
                <h2>Show this at the pump</h2>
                <p class="ot-lead">The attendant scans it and fills your order.</p>
                <div class="ot-qr" id="qr"></div>
                ${digits(o.code, true)}
                <div class="ot-cap">Backup code</div>
                <p class="ot-muted">Tip: turn your screen brightness up.</p>
              </div>
              <div class="ot-card">${details(o, `<div><dt>Paid</dt><dd>${fmtTime(o.paidAt)} · ${T.esc((o.payMethod || "").toUpperCase())}</dd></div>`)}</div>`;
          } else if (st === "fulfilled") {
            html = `<div class="ot-card ot-center">
                <div class="ot-ok">${svg('<path d="M20 6 9 17l-5-5"/>', 32)}</div>
                <h2>All filled. Thank you!</h2>
                <p class="ot-lead">Here's your receipt.</p>
              </div>
              <div class="ot-card">${details(o, `
                  <div><dt>Paid</dt><dd>${fmtTime(o.paidAt)} · ${T.esc((o.payMethod || "").toUpperCase())}</dd></div>
                  <div><dt>Filled</dt><dd>${fmtTime(o.fulfilledAt)}</dd></div>
                  ${o.dispensedKg ? `<div><dt>Dispensed</dt><dd>${T.esc(o.dispensedKg)} kg</dd></div>` : ""}
                  <div><dt>Receipt</dt><dd style="font-family:var(--mono);">${T.esc(id.slice(0, 8).toUpperCase())}</dd></div>`)}</div>
              <button class="btn btn-secondary no-print" onclick="window.print()">Save or print receipt</button>
              <a class="btn btn-primary no-print" href="order.html" data-open-order>Order again</a>`;
          } else {
            const why = st === "expired" ? "This order wasn’t paid within 12 hours." : st === "refunded" ? "The station refunded this order." : "This order was cancelled.";
            html = `<div class="ot-card"><span class="ot-pill ${info.tone}">${info.label}</span><h2>${info.label}</h2><p class="ot-lead">${why}</p></div>
              <div class="ot-card">${details(o)}</div>
              <a class="btn btn-primary" href="order.html" data-open-order>Place a new order</a>`;
          }
          app.innerHTML = html;
          if (st === "paid" && o.qrToken) T.renderQR(document.getElementById("qr"), T.qrPayload(id, o.qrToken), 8);
          const c = document.getElementById("cancelBtn");
          if (c) c.addEventListener("click", () => cancel(o));
        }

        async function cancel(o) {
          if (!confirm(`Cancel order ${o.code}?`)) return;
          try {
            await T.init().db.collection("orders").doc(id).update({
              status: "cancelled", cancelReason: "Cancelled by customer",
              cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          } catch (e) { alert("Could not cancel. If you already paid, please speak to the cashier."); }
        }

        function renderStart() {
          const mine = T.myOrders();
          document.getElementById("otTitle").textContent = mine.length ? "My orders" : "Order LPG online";
          app.innerHTML = `<div class="ot-card">
              <h2 style="margin-top:0;">Skip the queue</h2>
              <ol class="ot-steps">
                <li><b class="n">1</b><span>Choose your station and how much gas. You get a <b>4-digit code</b>.</span></li>
                <li><b class="n">2</b><span>Pay at the station cashier (cash or Mobile Money).</span></li>
                <li><b class="n">3</b><span>Your <b>QR code</b> appears on this page. Show it at the pump and you're filled.</span></li>
              </ol>
              <a class="btn btn-primary" href="order.html" data-open-order style="margin-top:20px;">Start an order</a>
            </div>
            ${mine.length ? `<div class="ot-card"><h2 style="margin-top:0;font-size:18px;">Recent orders on this phone</h2><div class="ot-list">${mine.map((m) => `<a href="order.html?id=${encodeURIComponent(m.id)}"><span><b>${T.esc(T.outletName(m.outlet))}</b> · ${T.money(m.amount)}<small>${new Date(m.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</small></span><span class="code">${T.esc(m.code)}</span></a>`).join("")}</div></div>` : ""}`;
          if (!mine.length) setTimeout(() => window.openPublicOrderModal && window.openPublicOrderModal(), 300);
        }

        if (!id) { renderStart(); return; }
        const { db } = T.init();
        let last = null;
        db.collection("orders").doc(id).onSnapshot(async (snap) => {
          if (!snap.exists) { app.innerHTML = '<div class="ot-card"><h2 style="margin-top:0;">Order not found</h2><p class="ot-lead">Check the link, or place a new order.</p></div><a class="btn btn-primary" href="order.html" data-open-order>Order LPG</a>'; return; }
          const o = snap.data();
          if (!station) {
            try { const s = await db.collection("stations").doc(o.outlet).get(); station = s.exists ? s.data() : {}; } catch (e) { station = {}; }
          }
          const changed = last && last.status !== o.status;
          if (changed && navigator.vibrate) navigator.vibrate([120, 60, 120]);
          last = o;
          T.rememberOrder({ id, code: o.code, outlet: o.outlet, amount: o.amount });
          render(o);
          if (changed) window.scrollTo({ top: 0, behavior: "smooth" });
        }, (err) => {
          console.error(err);
          app.innerHTML = '<div class="ot-card"><h2 style="margin-top:0;">Connection problem</h2><p class="ot-lead">We couldn’t load your order. Check your internet and refresh.</p></div>';
        });
        // Show "expired" once an unpaid order passes 12 hours, without a refresh.
        setInterval(() => { if (last && last.status === "pending" && T.effectiveStatus(last) === "expired") render(last); }, 60000);
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
